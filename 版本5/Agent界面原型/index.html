<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献阅读工作台</title>
<link rel="stylesheet" href="vendor/psj-ui/styles.css"><link rel="stylesheet" href="vendor/psj-ui/materials.css"><link rel="stylesheet" href="vendor/psj-ui/ai-companion.css"><link rel="stylesheet" href="app.css?v=20261026-page-zoom"></head>
<body>
<header class="app-header"><div class="identity"><span class="workspace-label">文献阅读工作台</span></div><div class="header-right"><button class="button small" id="notes-toggle" aria-controls="notes-panel" aria-expanded="false">我的笔记</button></div></header>
<main class="workspace">
<section class="reader" aria-label="论文阅读区">
<div class="annotation-bar" role="toolbar" aria-label="论文批注工具栏"><div class="tools">
<button class="tool history-tool" id="undo" aria-label="撤销批注" title="撤销" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 4 9l5 5M4 9h9a7 7 0 0 1 7 7v3"/></svg></button>
<button class="tool history-tool" id="redo" aria-label="恢复批注" title="恢复（重做）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5-5 5m5-5h-9a7 7 0 0 0-7 7v3"/></svg></button><span class="tool-divider"></span>
<button class="tool active" data-tool="select" aria-label="选择文字" title="选择文字" aria-pressed="true">选择</button>
<button class="tool" data-tool="text" aria-label="添加文字" title="点击论文添加文字" aria-pressed="false">文字</button>
<button class="tool" data-tool="pen" aria-label="画笔" title="画笔" aria-pressed="false">画笔</button>
<button class="tool" data-tool="highlight" aria-label="高亮" title="高亮：拖选文字" aria-pressed="false">高亮</button>
<button class="tool" data-tool="rectangle" aria-label="画方框" title="画方框" aria-pressed="false">方框</button>
<button class="tool" data-tool="eraser" aria-label="橡皮擦" title="橡皮擦：按住拖动擦除" aria-pressed="false">橡皮擦</button>
<span class="tool-divider"></span><div class="colors" aria-label="批注颜色"><button class="color active" data-color="#f4cf60" style="--swatch:#f4cf60" aria-label="黄色" aria-pressed="true">黄</button><button class="color" data-color="#6da3ef" style="--swatch:#6da3ef" aria-label="蓝色" aria-pressed="false">蓝</button><button class="color" data-color="#8ec6ad" style="--swatch:#8ec6ad" aria-label="绿色" aria-pressed="false">绿</button><button class="color" data-color="#e5a1b4" style="--swatch:#e5a1b4" aria-label="粉色" aria-pressed="false">粉</button></div></div><div class="view-switch" role="group" aria-label="阅读语言"><button id="view-english" aria-pressed="false">英文</button><button id="view-chinese" aria-pressed="true">中文</button><button id="view-bilingual" aria-pressed="false">中英对照</button></div><div class="zoom-tools"><button class="tool" id="zoom-out" aria-label="缩小页面">缩小</button><span id="zoom-value">100%</span><button class="tool" id="zoom-in" aria-label="放大页面">放大</button></div></div>
<div class="reader-body"><button class="button ai-toggle" id="chat-open" aria-label="展开AI助手" aria-controls="chat-panel" aria-expanded="false" hidden>ai</button><div class="outline-float"><button class="button outline-toggle" id="outline-toggle" aria-controls="paper-outline" aria-expanded="false">目录</button><nav class="outline glass-panel" id="paper-outline" aria-label="论文目录" hidden><div class="outline-heading"><span class="outline-label">目录</span><button class="tool" id="outline-close" aria-label="收起目录">收起</button></div><button data-page="0">摘要与引言</button><button class="selected" data-page="1">研究方法</button><button data-page="2">研究结果</button><button data-page="3">讨论</button><button data-page="4">参考文献</button><div class="outline-bottom"><span id="reading-mode-label">中文阅读</span></div></nav></div>
<div class="paper-scroll" id="paper-scroll"><div class="paper-zoom-stage"><div class="paper-spread"><div class="paper-wrap" id="paper-wrap"><article class="paper" id="paper" aria-label="论文正文"></article><svg id="ink-layer" class="ink-layer" aria-label="中文手绘批注"></svg></div><div class="paper-wrap english-wrap" id="english-wrap" hidden><article class="paper english-paper" id="english-paper" lang="en" aria-label="英文论文正文"></article><svg id="english-ink-layer" class="ink-layer" aria-label="英文手绘批注"></svg></div></div></div></div></div>
<footer class="reader-footer"><span id="tool-status">选中原文后点击“讨论”，可带入聊天</span><div><button class="tool" id="prev-page" aria-label="上一节">上一节</button><span id="page-label">1 / 5</span><button class="tool" id="next-page" aria-label="下一节">下一节</button></div></footer>
</section>
<aside id="chat-panel" class="chat-panel glass-panel" aria-label="AI助手"><header class="chat-header" id="chat-drag-handle" title="拖动AI助手"><div><h1>AI助手</h1></div><button class="tool" id="chat-collapse" title="收起对话栏" aria-label="收起对话栏" aria-controls="chat-panel" aria-expanded="true">收起</button></header>
<div class="messages" id="messages" role="log" aria-label="对话记录"></div>
<div class="compose-area">
<form class="composer glass-panel" id="chat-form"><div class="quote-draft" id="quote-draft" hidden><span id="quote-text"></span><button type="button" class="tool" id="remove-quote" aria-label="移除引用">移除</button></div><textarea id="message-input" rows="2" aria-label="输入你的问题或判断" placeholder="说说你的判断，或选一段原文一起讨论…"></textarea><div class="composer-bottom"><span>Enter 发送 <i>·</i> Shift + Enter 换行</span><button class="button button-primary send-button" id="send" type="submit" aria-label="发送消息" disabled>发送</button></div></form></div>
<button type="button" id="chat-resize-handle" aria-label="调整AI助手大小" title="拖动调整大小，也可使用方向键"></button></aside></main>
<div id="selection-menu" class="selection-menu glass-panel" role="toolbar" aria-label="原文选区操作" hidden><button type="button" id="discuss-quote">讨论</button></div>
<aside id="notes-panel" class="notes-panel glass-panel" hidden><header id="notes-drag-handle" title="拖动笔记窗口"><h2>我的笔记</h2><button class="tool" id="notes-close" aria-label="关闭笔记">关闭</button></header><textarea id="note-input" aria-label="Markdown 笔记" spellcheck="false"></textarea><div class="note-editor-footer"><span>Markdown</span><span id="note-save-status" role="status">自动保存到本机</span></div><button type="button" id="notes-resize-handle" aria-label="调整笔记大小" title="拖动调整大小，也可使用方向键"></button></aside><div id="eraser-cursor" aria-hidden="true" hidden></div><div id="toast" role="status" hidden></div>
<script src="article.js?v=20261026-page-zoom"></script><script src="article-en.js?v=20261026-page-zoom"></script><script src="app.js?v=20261026-page-zoom"></script></body></html>
